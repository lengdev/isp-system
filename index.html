<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23EA6A3C'><path d='M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9l6 4.5-6 4.5z'/></svg>" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)" />
  <title>NSMISP - ISP Customer Management & Operations</title>
  <!-- Prevent theme/comfort/density/motion flash on initial load -->
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('nsmisp-storage') || localStorage.getItem('nsmisp_isp_store_v1');
        var state = (raw ? JSON.parse(raw).state : null) || {};
        var themeMode = state.themeMode || (state.darkMode ? 'dark' : 'light');
        var isDark =
          themeMode === 'dark' ||
          (themeMode === 'system' &&
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: dark)').matches);
        var comfort = state.comfort || 'soft';
        var density = state.density || 'compact';
        var animations = state.animations || 'system';

        if (isDark) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
        document.documentElement.setAttribute('data-comfort', comfort);
        document.documentElement.setAttribute('data-density', density);
        document.documentElement.setAttribute('data-motion', animations);
      } catch (e) {}
    })();
  </script>
</head>

<body
  class="bg-[var(--bg-app)] text-[var(--text)] antialiased selection:bg-[var(--brand-soft)] selection:text-[var(--brand)]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
