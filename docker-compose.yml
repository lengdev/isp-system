version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: netpulse-postgres
    restart: always
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: netpulse123
      POSTGRES_DB: netpulse
    ports:
      - '5432:5432'
    volumes:
      - netpulse_pgdata:/var/lib/postgresql/data
      - ./prisma/migrations/20261123000000_init/migration.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U netpulse -d netpulse']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Background Queue
  redis:
    image: redis:7-alpine
    container_name: netpulse-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - netpulse_redisdata:/data

  # 3. NetPulse Node.js / Express Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: netpulse-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://netpulse:netpulse123@postgres:5432/netpulse?schema=public
      JWT_SECRET: netpulse-production-grade-jwt-secret-key-2026
      JWT_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
      MIKROTIK_DEFAULT_HOST: 192.168.88.1
      MIKROTIK_DEFAULT_PORT: 8728
      MIKROTIK_DEFAULT_USER: admin
      MIKROTIK_DEFAULT_PASS: netpulse123
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. NetPulse Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: netpulse-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  netpulse_pgdata:
  netpulse_redisdata:
