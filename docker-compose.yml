version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: nsmisp-postgres
    restart: always
    environment:
      POSTGRES_USER: nsmisp
      POSTGRES_PASSWORD: nsmisp123
      POSTGRES_DB: nsmisp
    ports:
      - '5432:5432'
    volumes:
      - nsmisp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nsmisp -d nsmisp']
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Background Queue
  redis:
    image: redis:7-alpine
    container_name: nsmisp-redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - nsmisp_redisdata:/data

  # 3. NSMISP Node.js / Express Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: nsmisp-backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://nsmisp:nsmisp123@postgres:5432/nsmisp?schema=public
      JWT_SECRET: nsmisp-production-grade-jwt-secret-key-2026
      JWT_EXPIRES_IN: 7d
      REDIS_URL: redis://redis:6379
      MIKROTIK_DEFAULT_HOST: 192.168.88.1
      MIKROTIK_DEFAULT_PORT: 8728
      MIKROTIK_DEFAULT_USER: admin
      MIKROTIK_DEFAULT_PASS: nsmisp123
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  # 4. NSMISP Frontend (Nginx)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: nsmisp-frontend
    restart: always
    ports:
      - '80:80'
    depends_on:
      - backend

volumes:
  nsmisp_pgdata:
  nsmisp_redisdata:
